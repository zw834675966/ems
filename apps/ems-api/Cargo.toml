[package]
name = "ems-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"
publish = false

[features]
# 将 web/admin 的 dist 静态资源内嵌到二进制（单文件分发）
embedded-ui = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
api-contract = { workspace = true }
axum = { workspace = true }
async-trait = { workspace = true }
dotenvy = { workspace = true }
ems-auth = { workspace = true }
ems-config = { workspace = true }
ems-control = { workspace = true }
ems-protocol = { workspace = true }
ems-storage = { workspace = true, default-features = false }
ems-telemetry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
domain = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp"] }
rust-embed = { version = "8.7.2", optional = true, features = ["compression"] }
mime_guess = { version = "2.0.5", optional = true }

[dev-dependencies]
bytes = "1"
http-body-util = "0.1"
