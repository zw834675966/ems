# ============================================================================
# EMS 生产级 Nginx 配置
# ============================================================================
#
# 本配置文件用于生产环境的 Nginx 反向代理，包含：
# - SSL/TLS 终止
# - 安全 Headers
# - API 和前端反向代理
# - /metrics 访问限制
#
# 使用前请替换以下占位符：
#   - /path/to/ssl/certificate.crt - SSL 证书路径
#   - /path/to/ssl/private.key    - SSL 私钥路径
#   - your-domain.com             - 您的域名
#   - 10.0.0.0/8                  - 内网 IP 段
# ============================================================================

# 工作进程数，auto 表示自动检测 CPU 核心数
worker_processes auto;

# 错误日志配置
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # 每个工作进程的最大连接数
    worker_connections 4096;
    
    # 使用 epoll 事件驱动模型（Linux）
    use epoll;
    
    # 同时接受多个连接
    multi_accept on;
}

http {
    # 基础配置
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    # 日志格式（JSON 格式便于日志分析）
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"remote_user":"$remote_user",'
            '"request":"$request",'
            '"status":"$status",'
            '"body_bytes_sent":"$body_bytes_sent",'
            '"request_time":"$request_time",'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_referrer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for",'
            '"request_id":"$request_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript application/x-javascript;

    # 限制请求体大小
    client_max_body_size 10M;

    # 隐藏 Nginx 版本号
    server_tokens off;

    # ========================================================================
    # 上游服务定义
    # ========================================================================
    
    # EMS API 后端
    upstream ems_api {
        server ems-api:8080;
        keepalive 32;
    }

    # EMS Web Admin 前端
    upstream ems_web {
        server ems-web-admin:80;
        keepalive 8;
    }

    # ========================================================================
    # 内网 IP 限制（用于 /metrics 访问控制）
    # ========================================================================
    
    geo $is_internal {
        default 0;
        10.0.0.0/8      1;
        172.16.0.0/12   1;
        192.168.0.0/16  1;
        127.0.0.1       1;
    }

    # ========================================================================
    # HTTP → HTTPS 重定向
    # ========================================================================
    
    server {
        listen 80;
        listen [::]:80;
        server_name your-domain.com;

        # ACME 证书验证路径（Let's Encrypt）
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 其他请求重定向到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ========================================================================
    # HTTPS 主服务
    # ========================================================================
    
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name your-domain.com;

        # --------------------------------------------------------------------
        # SSL/TLS 配置
        # --------------------------------------------------------------------
        
        ssl_certificate /path/to/ssl/certificate.crt;
        ssl_certificate_key /path/to/ssl/private.key;
        
        # TLS 版本限制（仅 TLS 1.2+）
        ssl_protocols TLSv1.2 TLSv1.3;
        
        # 密码套件（现代安全配置）
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        
        # SSL 会话缓存
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        
        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # --------------------------------------------------------------------
        # 安全 Headers
        # --------------------------------------------------------------------
        
        # HSTS（强制 HTTPS，有效期 1 年）
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        
        # 禁止在 iframe 中嵌套（防止点击劫持）
        add_header X-Frame-Options "SAMEORIGIN" always;
        
        # XSS 保护
        add_header X-XSS-Protection "1; mode=block" always;
        
        # 禁止 MIME 类型嗅探
        add_header X-Content-Type-Options "nosniff" always;
        
        # Referrer 策略
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # 内容安全策略（根据需要调整）
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;" always;
        
        # 禁止搜索引擎索引（可选）
        # add_header X-Robots-Tag "noindex, nofollow" always;

        # --------------------------------------------------------------------
        # API 反向代理
        # --------------------------------------------------------------------
        
        location /api/ {
            proxy_pass http://ems_api/;
            proxy_http_version 1.1;
            
            # 保持连接
            proxy_set_header Connection "";
            
            # 传递客户端信息
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 生成请求 ID（用于追踪）
            proxy_set_header X-Request-ID $request_id;
            
            # 超时配置
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # 缓冲配置
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # --------------------------------------------------------------------
        # /metrics 端点（仅内网访问）
        # --------------------------------------------------------------------
        
        location /api/metrics {
            # 仅允许内网 IP 访问
            if ($is_internal = 0) {
                return 403;
            }
            
            # 或者要求特定 Header（可选，取消注释启用）
            # if ($http_x_metrics_token != "your-secret-token") {
            #     return 403;
            # }
            
            proxy_pass http://ems_api/metrics;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --------------------------------------------------------------------
        # 健康检查端点（公开）
        # --------------------------------------------------------------------
        
        location /api/livez {
            proxy_pass http://ems_api/livez;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        location /api/readyz {
            proxy_pass http://ems_api/readyz;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # --------------------------------------------------------------------
        # 前端静态资源
        # --------------------------------------------------------------------
        
        location / {
            proxy_pass http://ems_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 静态资源缓存
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                proxy_pass http://ems_web;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # --------------------------------------------------------------------
        # 错误页面
        # --------------------------------------------------------------------
        
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
